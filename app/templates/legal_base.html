<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} — SiSFarm</title>
<meta name="description" content="{% block description %}{% endblock %}">
<link rel="canonical" href="{{ site_url }}{{ request.url.path }}">
<link rel="icon" href="/static/favicon.svg">
<style>
:root{--bg:#f6f8f5;--card:#fff;--txt:#1d2a22;--mut:#5b6b61;--line:#e3e9e4;--brand:#3f7d2c}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#050f0a;padding:14px 16px}header a{display:inline-flex;align-items:center}
header img{height:30px}
main{max-width:780px;margin:32px auto;padding:32px 20px;background:var(--card);border:1px solid var(--line);border-radius:20px}
h1{font-size:30px;line-height:1.2;margin:0 0 6px}h2{font-size:19px;margin:30px 0 8px}
p,li{color:#334139}.upd{color:var(--mut);font-size:14px;margin:0 0 24px}a{color:var(--brand)}
footer{text-align:center;color:var(--mut);font-size:14px;padding:0 16px 40px}
@media (max-width:640px){main{margin:0;border-radius:0;border-left:0;border-right:0}h1{font-size:25px}}
</style>
</head>
<body>
<header><a href="/" aria-label="SiSFarm — início"><img src="/static/images/logo-icon.png" alt=""><img src="/static/images/logo-wordmark.png" alt="SiSFarm" style="height:22px;margin-left:4px"></a></header>
<main>
<h1>{{ self.title() }}</h1>
<p class="upd">Última atualização: {{ updated_on }}</p>
{% block content %}{% endblock %}
</main>
<footer><a href="/termos">Termos de Uso</a> · <a href="/privacidade">Política de Privacidade</a> · <a href="/">SiSFarm</a></footer>
</body>
</html>
