{# Importar perímetro do setor (canvas: "Importar perímetro do arquivo" com arrastar e soltar). Aceita .kml, .geojson e .json. #}
<div class="stw-import" data-plots-geojson-card data-plot-geojson-manager>
    <div class="stw-drop" data-plot-geojson-dropzone>
        <span class="stw-drop-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg></span>
        <div class="stw-drop-copy">
            <strong>Importar perímetro do arquivo</strong>
            <small>Arraste e solte aqui ou procure no aparelho · aceita .kml, .geojson e .json</small>
        </div>
        <label class="szw-btn stw-drop-btn">
            Procurar arquivo
            <input type="file" accept=".kml,.json,.geojson,application/vnd.google-earth.kml+xml,application/json,text/xml" class="sr-only" data-plot-geojson-picker>
        </label>
    </div>
    <p class="stw-drop-status" role="status" aria-live="polite" data-plot-geojson-status hidden></p>
    <input type="file" name="boundary_geojson_file" accept=".kml,.json,.geojson" class="sr-only" tabindex="-1" aria-hidden="true" data-plot-geojson-submit-input>
    <div class="stw-file" hidden data-plot-geojson-pending>
        <div class="stw-file-head"><span class="szw-overline">Arquivo selecionado</span><button type="button" class="szw-link" data-plot-geojson-clear>Limpar seleção</button></div>
        <div data-plot-geojson-pending-list></div>
    </div>
</div>
