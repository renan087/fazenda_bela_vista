{% macro icon(name, size=18, width=2) -%}

{%- elif name == 'search' %}<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>

{%- elif name == 'map' %}<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path>
{%- elif name == 'chev' %}<path d="M9 6l6 6-6 6"></path>
{%- elif name == 'check' %}<path d="M5 12l5 5 9-11"></path>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5h.01"></path>
{%- elif name == 'alert' %}<path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
{%- elif name == 'upload' %}<path d="M12 16V4M6 10l6-6 6 6M5 20h14"></path>
{%- elif name == 'upload2' %}<path d="M12 20V8M6 14l6-6 6 6M5 4h14"></path>
{%- elif name == 'download' %}<path d="M12 4v12M6 10l6 6 6-6M5 20h14"></path>
{%- elif name == 'edit' %}<path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
{%- elif name == 'file' %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path>
{%- elif name == 'copy' %}<rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
{%- elif name == 'x' %}<path d="M6 6l12 12M18 6L6 18"></path>

{%- elif name == 'play' %}<path d="M7 5l12 7-12 7z"></path>
{%- elif name == 'trash' %}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path>
{%- elif name == 'dots' %}<circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle>
{%- endif %}
</svg>
{%- endmacro %}
