@keyframes pz-impact{0%,42%{opacity:0}44%{opacity:1}49%{opacity:0}56%{opacity:0}58%{opacity:1}64%,100%{opacity:0}}
@keyframes pz-lean{0%,30%,70%,100%{transform:rotate(0)}44%,58%{transform:rotate(2.5deg) scale(1.02)}}
