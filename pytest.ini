[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    suite_coffee_market: Cotação CEPEA/ESALQ e variação mensal
    suite_rbac: Papéis, permissões e catálogo RBAC
    suite_security: Autenticação, senha e tokens JWT
    suite_path_access: Mapeamento URL → permissões do middleware web
    suite_dashboard: KPIs e formatação do painel da fazenda
    suite_quality_meta: Metadados do catálogo de testes automatizados
